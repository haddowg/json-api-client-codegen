name: Generated output

# Nothing commits the generated output, so this is where a change to it is reviewed: every pull
# request generates the test suite's output on its base and on its head, from the documents each
# side pins, keeps one comment reporting the difference, and fails until the `generated-output`
# label says someone read it. A release pull request only bumps the version and changelog.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# No workflow-level permissions; each job requests only what it needs.
permissions: {}

concurrency:
  group: generated-output-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generated-output:
    name: Generated output
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Generate the head's output
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NPM_CONFIG_USERCONFIG="$(.github/scripts/npm-auth)"
          npm install --no-audit --no-fund
          php bin/export-generated-output.php "$RUNNER_TEMP/generated/head"

      # A base from before the export script committed its output as golden files instead.
      - name: Generate the base's output
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NPM_CONFIG_USERCONFIG="$("$GITHUB_WORKSPACE/.github/scripts/npm-auth")"
          git worktree add -q "$RUNNER_TEMP/base-src" "$BASE"
          cd "$RUNNER_TEMP/base-src"
          mkdir -p "$RUNNER_TEMP/generated/base"
          if [ -f bin/export-generated-output.php ]; then
            composer install --no-interaction --no-progress --quiet
            npm install --no-audit --no-fund
            php bin/export-generated-output.php "$RUNNER_TEMP/generated/base"
          else
            cp -R tests/golden/. "$RUNNER_TEMP/generated/base/"
          fi

      - name: Report the difference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/generated-output-report "$RUNNER_TEMP/generated/base" "$RUNNER_TEMP/generated/head"
